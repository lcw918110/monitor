<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简易多机监控</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>简易多机监控</h1>
        <p class="sub tip-host" data-tip-id="scope">中心控制台 · CPU / 加速卡监测 · v1.13.0</p>
      </div>
    </div>
    <nav class="shell-nav" aria-label="主导航">
      <a class="shell-link active" href="#realtime" data-shell="realtime">实时监控</a>
      <a class="shell-link" href="#hosts" data-shell="hosts">主机</a>
      <a class="shell-link" href="#period" data-shell="period">时段统计</a>
      <a class="shell-link" href="#reports" data-shell="reports">使用诊断</a>
      <a class="shell-link" href="/deploy.html" data-shell="ops">运维</a>
      <a class="shell-link" href="/settings.html" data-shell="settings">设置</a>
    </nav>
    <div class="top-meta">
      <a class="link tip-host" href="/api/v1/export/hosts.csv" data-tip-id="export-csv">导出 CSV</a>
      <a class="link" href="/api/v1/export/hosts.json">导出 JSON</a>
      <span id="refreshHint">自动刷新 15s</span>
      <button type="button" id="btnRefresh" class="btn">立即刷新</button>
    </div>
  </header>

  <div id="viewRealtime" class="tab-view">
    <section class="attention" id="attention" aria-label="今日关注">
      <div class="attention-head">
        <h2 class="tip-host" data-tip-id="attention">今日关注</h2>
      </div>
      <div class="attention-row" id="attentionList"></div>
      <div class="attention-names" id="attentionNames"></div>
      <div class="anomaly-summary" id="anomalySummary" aria-label="异常汇总"></div>
    </section>
    <section class="stats" id="stats" aria-label="集群统计"></section>

    <main class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>主机资源</h2>
          <div class="filters">
            <input id="filterQ" type="search" placeholder="搜索主机 / 地址 / 历史 IP / 负责人 / 用途..." />
            <select id="filterType">
              <option value="">全部类型</option>
              <option value="cpu">CPU</option>
              <option value="gpu">GPU（加速卡）</option>
              <option value="auto">自动</option>
            </select>
            <select id="filterStatus">
              <option value="">全部判定</option>
              <option value="critical">异常</option>
              <option value="warn">偏高</option>
              <option value="normal">正常</option>
              <option value="unknown">未知</option>
            </select>
            <select id="filterGroup">
              <option value="">全部资源组</option>
              <option value="__none__">未分组</option>
            </select>
            <select id="filterOwner">
              <option value="">全部负责人</option>
              <option value="__none__">未填负责人</option>
            </select>
            <button type="button" id="btnGroups" class="btn btn-sm tip-host" data-tip-id="groups">管理分组</button>
            <button type="button" id="btnHidden" class="btn btn-sm tip-host" data-tip-id="hidden-hosts">已隐藏</button>
            <button type="button" id="btnImport" class="btn btn-sm tip-host" data-tip-id="import-assets">导入资产</button>
            <span class="muted" id="hostCount"></span>
          </div>
        </div>
        <div class="group-panel" id="groupPanel" hidden>
          <div class="group-panel-row">
            <input id="newGroupName" type="text" maxlength="40" placeholder="新资源组名称" />
            <button type="button" id="btnAddGroup" class="btn btn-sm">添加</button>
          </div>
          <div class="group-chip-list" id="groupList"></div>
        </div>
        <div class="group-panel" id="hiddenPanel" hidden>
          <div id="hiddenList"><p class="muted">加载中…</p></div>
        </div>
        <div class="group-panel" id="importPanel" hidden>
          <div class="group-panel-row">
            <input id="importFile" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
            <button type="button" id="btnImportPreview" class="btn btn-sm">预览匹配</button>
            <button type="button" id="btnImportApply" class="btn btn-sm" disabled>写入匹配行</button>
          </div>
          <div id="importResult"></div>
        </div>
        <div class="table-wrap">
          <table id="hostTable">
            <thead>
              <tr>
                <th class="sortable" data-sort="online">在线</th>
                <th class="sortable" data-sort="status">资源判定</th>
                <th class="sortable" data-sort="host">主机 / 地址</th>
                <th class="sortable" data-sort="group">资源组</th>
                <th class="sortable" data-sort="owner">负责人</th>
                <th class="sortable" data-sort="purpose">用途</th>
                <th class="sortable" data-sort="type">类型</th>
                <th class="sortable" data-sort="cpu_percent">CPU利用率</th>
                <th class="sortable" data-sort="mem_percent">内存利用率</th>
                <th class="sortable tip-host" data-sort="disk_percent" data-tip-id="disk-cap">磁盘占用</th>
                <th class="sortable tip-host" data-sort="disk_count" data-tip-id="disk-count">磁盘数</th>
                <th class="sortable tip-host" data-sort="accel" data-tip-id="accel-id">加速卡</th>
                <th class="sortable tip-host" data-sort="accel_util" data-tip-id="accel-util">加速卡使用率</th>
                <th class="sortable tip-host" data-sort="load1" data-tip-id="load-high">负载</th>
                <th class="sortable" data-sort="last_seen">最近上报</th>
              </tr>
            </thead>
            <tbody id="hostBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel detail">
        <div class="panel-head">
          <h2>主机详情</h2>
          <span class="muted" id="detailTitle">请选择左侧主机</span>
        </div>
        <div id="detailBody" class="detail-body">
          <p class="empty">暂无选中主机</p>
        </div>
      </section>
    </main>
  </div>

  <div id="viewPeriod" class="tab-view" hidden>
    <section class="period-toolbar" aria-label="时段统计筛选">
      <h2>时段统计</h2>
      <div class="filters period-util-controls" id="periodUtilControls"></div>
    </section>
    <div class="period-summary" id="periodSummary" aria-label="汇总"></div>
    <div class="period-layout">
      <section class="panel period-util-panel">
        <div class="panel-head">
          <h2 class="tip-host" data-tip-id="period-list">集群与主机</h2>
        </div>
        <div class="period-util-body" id="periodUtilBody">
          <p class="muted">加载时段统计…</p>
        </div>
      </section>
      <section class="panel period-detail">
        <div class="panel-head">
          <h2 id="periodDetailHeading">主机时段</h2>
          <span class="muted" id="periodDetailTitle">请选择主机</span>
        </div>
        <div id="periodDetailBody" class="detail-body">
          <p class="empty">未选择主机</p>
        </div>
      </section>
      <section class="panel period-charts-panel" aria-label="趋势">
        <div class="panel-head">
          <h2 class="tip-host" data-tip-id="trend">趋势</h2>
        </div>
        <div id="periodCharts" class="period-charts">
          <p class="empty">未选择主机</p>
        </div>
      </section>
    </div>
  </div>

  <div id="viewReports" class="tab-view" hidden>
    <section class="period-toolbar" aria-label="使用诊断">
      <div class="period-title">
        <h2 class="tip-host" data-tip-id="reports">使用诊断</h2>
      </div>
      <div class="filters" id="reportControls">
        <button type="button" class="period-btn active" data-report-period="day">日报</button>
        <button type="button" class="period-btn" data-report-period="week">周报</button>
        <button type="button" class="period-btn" data-report-period="month">月报</button>
        <label class="report-date" for="reportWindowDate">窗口日期
          <input type="date" id="reportWindowDate" />
        </label>
        <button type="button" class="btn" id="btnGenerateReport">生成并保存</button>
        <span class="muted" id="reportWindowHint"></span>
      </div>
    </section>
    <div class="report-layout">
      <section class="panel">
        <div class="panel-head">
          <h2 class="tip-host" data-tip-id="report-open">已保存</h2>
        </div>
        <div id="reportList" class="report-list">
          <p class="muted">加载报告列表…</p>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2 class="tip-host" data-tip-id="report-preview">预览</h2>
          <span id="reportActions" class="report-actions"></span>
        </div>
        <div id="reportPreview" class="report-preview">
          <p class="empty tip-host" data-tip-id="report-empty-preview">尚未打开报告</p>
        </div>
      </section>
    </div>
  </div>

  <script src="/ux.js"></script>
  <script src="/admin.js"></script>
  <script src="/app.js"></script>
</body>
</html>
