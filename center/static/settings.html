<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · 中心参数 / 管理 Token / 报告推送</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>简易多机监控</h1>
        <p class="sub tip-host" data-tip-id="settings-foot">设置 · 中心参数 / 管理 Token / 报告推送 · v1.13.0</p>
      </div>
    </div>
    <nav class="shell-nav" aria-label="主导航">
      <a class="shell-link" href="/#realtime" data-shell="realtime">实时监控</a>
      <a class="shell-link" href="/#hosts" data-shell="hosts">主机</a>
      <a class="shell-link" href="/#period" data-shell="period">时段统计</a>
      <a class="shell-link" href="/#reports" data-shell="reports">使用诊断</a>
      <a class="shell-link" href="/deploy.html" data-shell="ops">运维</a>
      <a class="shell-link active" href="/settings.html" data-shell="settings" aria-current="page">设置</a>
    </nav>
    <div class="top-meta">
      <button type="button" id="btnReload" class="btn">刷新</button>
    </div>
  </header>

  <main class="settings-layout">
    <section class="panel" id="sectionIntro">
      <div class="panel-head">
        <h2 class="tip-host" data-tip-id="settings-intro">中心参数</h2>
        <span class="muted" id="centerPath"></span>
      </div>
      <div class="settings-quick">
        <a class="btn" href="#group-schedule">报告时刻</a>
        <a class="btn" href="#sectionPush">报告推送</a>
        <a class="btn" href="#sectionToken">管理 Token</a>
      </div>
      <nav id="centerNav" class="settings-nav" aria-label="参数分组"></nav>
      <div class="form-actions">
        <button type="button" id="btnSaveAll" class="btn primary">保存已修改的中心参数</button>
        <button type="button" id="btnRestoreAll" class="btn">全部恢复默认</button>
        <span class="muted" id="centerHint"></span>
      </div>
    </section>

    <section class="panel" id="sectionDataGuard">
      <div class="panel-head">
        <div class="period-title">
          <h2 class="tip-host" data-tip-id="guard">重点数据守护</h2>
        </div>
        <span class="muted" id="guardStatus">加载中…</span>
      </div>
      <div class="form-grid">
        <label>作用范围
          <select id="guardScope">
            <option value="host">单台主机</option>
            <option value="group">整个资源组</option>
          </select>
        </label>
        <label>主机或资源组
          <select id="guardTarget"></select>
        </label>
        <label class="check-line span-2">
          <input id="guardEnabled" type="checkbox" />
          标为重点数据机
        </label>
        <label class="span-2 tip-host" data-tip-id="guard-paths">受保护路径
          <textarea id="guardPaths" rows="4" placeholder="/data/important"></textarea>
        </label>
        <label class="span-2 tip-host" data-tip-id="guard-cidrs">允许的内网目的网段
          <textarea id="guardCidrs" rows="3" placeholder="10.0.0.0/8"></textarea>
        </label>
        <label class="tip-host" data-tip-id="guard-mbps">外传速率
          <input id="guardMbps" type="number" min="0.1" max="100000" step="0.1" placeholder="例如 100" />
        </label>
        <label class="tip-host" data-tip-id="guard-sustain">速率连续保持
          <input id="guardSustain" type="number" min="15" max="3600" step="1" value="60" />
        </label>
        <label class="tip-host" data-tip-id="guard-volume">发送量
          <input id="guardVolume" type="number" min="1" step="1" placeholder="例如 1024" />
        </label>
        <label class="tip-host" data-tip-id="guard-volume-window">发送量窗口
          <input id="guardVolumeWindow" type="number" min="60" max="86400" step="1" value="3600" />
        </label>
        <label class="span-2 tip-host" data-tip-id="guard-baseline">相对平时的倍数
          <input id="guardBaseline" type="number" min="1" max="100" step="0.1" placeholder="例如 3" />
        </label>
        <label class="span-2 tip-host" data-tip-id="guard-allow-dest">白名单目的地址
          <textarea id="guardAllowDest" rows="3" placeholder="10.8.0.0/24"></textarea>
        </label>
        <label class="span-2 tip-host" data-tip-id="guard-allow-proc">白名单进程名
          <textarea id="guardAllowProc" rows="3" placeholder="rsync"></textarea>
        </label>
      </div>
      <p class="settings-copy" id="guardSource"></p>
      <div class="form-actions">
        <button type="button" id="btnSaveGuard" class="btn primary">保存重点数据守护</button>
        <button type="button" id="btnClearGuard" class="btn">清除本条</button>
        <span class="muted" id="guardHint"></span>
      </div>
    </section>

    <div id="centerLead"></div>

    <h2 class="settings-group-label tip-host" id="securityAnchor" data-tip-id="settings-security">推送与安全</h2>

    <section class="panel" id="sectionPush">
      <div class="panel-head">
        <h2 class="tip-host" data-tip-id="settings-push">诊断报告推送</h2>
        <span class="muted" id="pushStatus">加载中…</span>
      </div>
      <div class="form-grid">
        <label class="check-line">
          <input id="pushEnabled" type="checkbox" />
          启用推送
        </label>
        <label class="tip-host" id="channelLabel" data-tip-id="channel-wecom">渠道
          <select id="pushChannel">
            <option value="wecom">企业微信</option>
            <option value="dingtalk">钉钉</option>
            <option value="feishu">飞书</option>
          </select>
        </label>
        <label class="span-2">Webhook
          <input id="pushWebhook" type="password" autocomplete="off" placeholder="https://… 留空表示不修改已保存的地址" />
        </label>
      </div>
      <div class="form-actions">
        <button type="button" id="btnSavePush" class="btn primary">保存推送</button>
        <button type="button" id="btnTestPush" class="btn tip-host" data-tip-id="push-test">测试发送</button>
        <button type="button" id="btnClearPush" class="btn">清空 Webhook</button>
        <span class="muted" id="pushHint"></span>
      </div>
      <p id="pushLast" class="push-last">还没有推送记录。</p>
    </section>

    <section class="panel" id="sectionToken">
      <div class="panel-head">
        <h2 class="tip-host" data-tip-id="settings-token">管理 Token</h2>
        <span class="muted" id="tokenStatus">加载中…</span>
      </div>
      <div class="form-grid">
        <label>新的管理 Token
          <input id="mgmtToken" type="password" autocomplete="new-password" placeholder="至少 8 位，不能含空格。留空表示不修改" />
        </label>
        <label>再输入一次
          <input id="mgmtTokenAgain" type="password" autocomplete="new-password" placeholder="与上面一致" />
        </label>
      </div>
      <div class="form-actions">
        <button type="button" id="btnSaveToken" class="btn primary">保存管理 Token</button>
        <button type="button" id="btnClearToken" class="btn btn-danger">清空管理 Token</button>
        <span class="muted" id="tokenHint"></span>
      </div>
    </section>

    <div id="centerSecurity"></div>
    <div id="centerTail"></div>
  </main>

  <script src="/ux.js"></script>
  <script src="/admin.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
