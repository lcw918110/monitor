<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>运维 · 客户端部署</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1>简易多机监控</h1>
        <p class="sub tip-host" data-tip-id="ops-foot">运维 · 客户端部署 · v1.13.0</p>
      </div>
    </div>
    <nav class="shell-nav" aria-label="主导航">
      <a class="shell-link" href="/#realtime" data-shell="realtime">实时监控</a>
      <a class="shell-link" href="/#period" data-shell="period">时段统计</a>
      <a class="shell-link" href="/#reports" data-shell="reports">使用诊断</a>
      <a class="shell-link active" href="/deploy.html" data-shell="ops" aria-current="page">运维</a>
      <a class="shell-link" href="/settings.html" data-shell="settings">设置</a>
    </nav>
    <div class="top-meta">
      <button type="button" id="btnRefresh" class="btn">刷新</button>
    </div>
  </header>

  <main class="deploy-layout">
    <section class="panel wide" id="opsTargets">
      <div class="panel-head">
        <h2 class="tip-host" data-tip-id="ops-list">部署清单</h2>
        <div class="filters">
          <button type="button" id="btnDeploySelected" class="btn primary">部署勾选</button>
          <button type="button" id="btnDeployAll" class="btn">全部部署</button>
          <button type="button" id="btnOpenAdd" class="btn">加入一台机器</button>
          <button type="button" id="btnOpenExcel" class="btn">用表格一次加入</button>
          <button type="button" id="btnOpenSettings" class="btn">不常改的连接</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="chkAll" aria-label="勾选全部未停用的机器" /></th>
              <th>IP</th>
              <th>端口</th>
              <th>host_id</th>
              <th>类型</th>
              <th>登录方式</th>
              <th>要一起看的机器</th>
              <th>网络</th>
              <th>部署状态</th>
              <th>最近结果</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="targetBody">
            <tr><td colspan="11" class="ops-state">正在加载部署清单…</td></tr>
          </tbody>
        </table>
      </div>
      <p class="ops-inline-hint muted" id="rowTestHint"></p>
    </section>

    <section class="panel wide" id="opsLog">
      <div class="panel-head">
        <h2 class="tip-host" data-tip-id="ops-log">部署过程</h2>
        <span class="muted" id="jobMeta">还没有开始</span>
      </div>
      <pre class="log" id="jobLog">还没有部署任务。</pre>
    </section>
  </main>

  <div class="ops-modal" id="dlgAdd" hidden>
    <div class="ops-modal-backdrop" data-close="dlgAdd"></div>
    <div class="ops-modal-panel" role="dialog" aria-modal="true" aria-labelledby="dlgAddTitle">
      <div class="panel-head">
        <h2 class="tip-host" id="dlgAddTitle" data-tip-id="ops-add">加入一台机器</h2>
        <button type="button" class="btn btn-sm" data-close="dlgAdd">关闭</button>
      </div>
      <div class="form-grid">
        <label>IP / 主机名 <span class="req">*</span>
          <input id="tIp" placeholder="例如 10.0.0.21" />
        </label>
        <label>监控里的名字 host_id
          <input id="tHostId" placeholder="不填就用 IP" />
        </label>
        <label>显示名
          <input id="tHostname" placeholder="可选，方便认人" />
        </label>
        <label>采什么
          <select id="tType">
            <option value="auto">自动：有加速卡就采卡，否则只采系统</option>
            <option value="cpu">只采 CPU / 内存 / 磁盘 / 网络</option>
            <option value="gpu">系统 + 加速卡</option>
          </select>
        </label>
        <label>SSH 用户
          <input id="tUser" placeholder="不填就用「不常改的连接」里的默认用户" />
        </label>
        <label>这台机器的 SSH 密码
          <div class="password-field">
            <input id="tPassword" type="password" placeholder="不填就用默认密码或密钥" autocomplete="new-password" />
            <button type="button" class="pwd-toggle" data-target="tPassword" aria-label="显示或隐藏密码" title="显示/隐藏密码">
              <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden><path fill="currentColor" d="M2.1 3.5 3.5 2.1 21.9 20.5 20.5 21.9l-3.1-3.1A12.5 12.5 0 0 1 12 19c-5 0-9.3-3.1-11-7a13.7 13.7 0 0 1 4.3-5.1L2.1 3.5zM12 7a5 5 0 0 1 4.9 6.1l-1.6-1.6A2.5 2.5 0 0 0 12.5 8.7L12 7zm-7.4 4.1A11.4 11.4 0 0 0 12 17c1.4 0 2.7-.3 3.9-.8l-1.7-1.7A5 5 0 0 1 8.5 9.8L4.6 11.1zM12 5c1.2 0 2.3.2 3.4.6l-1.6 1.6A5 5 0 0 0 8.2 12L6.5 10.3C7.9 6.9 9.8 5 12 5z"/></svg>
            </button>
          </div>
        </label>
        <label>SSH 端口
          <input id="tPort" type="number" value="22" min="1" max="65535" placeholder="22" />
        </label>
        <label>这台机器单独用的私钥
          <input id="tKey" placeholder="不填就用「不常改的连接」里的默认私钥" />
        </label>
        <label>安装目录
          <input id="tRemoteDir" placeholder="不填就用「不常改的连接」里的默认目录" />
        </label>
        <label style="grid-column: 1 / -1;">要一起探测的机器
          <input id="tPeers" placeholder="例如 网关=10.0.0.1;存储=10.0.0.50" />
        </label>
      </div>
      <div class="form-actions">
        <button type="button" id="btnAdd" class="btn primary">加入清单</button>
        <button type="button" id="btnTestSsh" class="btn">先测能不能连上</button>
        <button type="button" id="btnCancelEdit" class="btn" hidden>取消编辑</button>
        <span class="muted" id="testHint"></span>
      </div>
    </div>
  </div>

  <div class="ops-modal" id="dlgExcel" hidden>
    <div class="ops-modal-backdrop" data-close="dlgExcel"></div>
    <div class="ops-modal-panel" role="dialog" aria-modal="true" aria-labelledby="dlgExcelTitle">
      <div class="panel-head">
        <h2 class="tip-host" id="dlgExcelTitle" data-tip-id="ops-excel">用表格一次加入</h2>
        <button type="button" class="btn btn-sm" data-close="dlgExcel">关闭</button>
      </div>
      <div class="form-actions">
        <a class="link" href="/api/v1/deploy/template.xlsx">下载表格模板</a>
        <label class="btn" style="display:inline-flex;align-items:center;cursor:pointer;">
          选择 Excel/CSV
          <input id="excelFile" type="file" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden />
        </label>
        <span class="muted" id="excelHint"></span>
      </div>
    </div>
  </div>

  <div class="ops-modal" id="dlgSettings" hidden>
    <div class="ops-modal-backdrop" data-close="dlgSettings"></div>
    <div class="ops-modal-panel" role="dialog" aria-modal="true" aria-labelledby="dlgSettingsTitle">
      <div class="panel-head">
        <h2 class="tip-host" id="dlgSettingsTitle" data-tip-id="ops-settings">不常改的连接</h2>
        <button type="button" class="btn btn-sm" data-close="dlgSettings">关闭</button>
      </div>
      <div class="form-grid" id="settingsForm">
        <label>中心地址 <span class="req">*</span>
          <input id="publicUrl" placeholder="http://&lt;中心IP&gt;:8080，自动填本机局域网，不要用 127.0.0.1" />
        </label>
        <label>默认 SSH 用户
          <input id="sshUser" placeholder="如 root / ubuntu" value="root" />
        </label>
        <label>默认 SSH 密码
          <input id="sshPassword" type="password" placeholder="留空表示不改已保存的密码" autocomplete="new-password" />
        </label>
        <label>默认 SSH 端口
          <input id="sshPort" type="number" value="22" min="1" max="65535" placeholder="22" />
        </label>
        <label>默认安装目录
          <input id="remoteDir" placeholder="/opt/monitor-agent" />
        </label>
        <label>默认私钥
          <input id="sshKey" placeholder="没单独指定私钥的机器共用这一把" />
        </label>
        <label>上报间隔（秒）
          <input id="interval" type="number" value="15" min="5" />
        </label>
      </div>
      <div class="form-actions">
        <button type="button" id="btnSaveSettings" class="btn primary">保存连接设置</button>
        <a class="link tip-host" href="/api/v1/deploy/install-script" data-tip-id="ops-rerun" download="install-agent.sh">补跑脚本</a>
        <span class="muted" id="settingsHint"></span>
      </div>
    </div>
  </div>

  <script src="/ux.js"></script>
  <script src="/admin.js"></script>
  <script src="/deploy.js"></script>
</body>
</html>
